<!DOCTYPE html>
<html>
<head>
	<title>Location Guard</title>
	<meta charset="utf-8">

	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>

	<link rel="stylesheet" href="css/ui.css"/>

	<style>
	/*
	the best way to autoresize the popup is to let #container expand to fit its contents, then set the html/body's
	width/height to those of #container using js. We initially set html/body's width/height to 0 to avoid resizes in chrome.
	*/
	html, body {
		width: 0px;
		height: 0px;
		overflow: hidden;		/* avoid momentary display of scrollbars */
	}
	#container {
		position: absolute;
		top: 0;
		left: 0;
		min-width: 16em;
		white-space: nowrap;
		line-height: 1;
		background: #fff;
	}
	#container .header {
		position: static;
		font-size: 0.9em;
		padding: 0 1em;
		height: auto;
		min-height: 44px;
	}
	#container .header h1 { margin: 0; }

	.menu-list {
		list-style: none;
		margin: 0;
		padding: 0;
	}
	.menu-list li { border-bottom: 1px solid #ddd; }
	.menu-list a {
		display: block;
		padding: 0.9em 1em 0.9em 2.6em;
		font-size: 0.88em;
		color: #333;
		text-decoration: none;
		background: no-repeat 1em center / 18px;
		cursor: pointer;
	}
	.menu-list a:hover { background-color: #eee; }
	.menu-list li.icon-pin a   { background-image: url("images/pin_16.png"); }
	.menu-list li.icon-pause a { background-image: url("images/pause.png"); }
	.menu-list li.icon-play a  { background-image: url("images/play.png"); }

	/* the level chooser covers the list, below the header */
	#levels {
		position: absolute;
		top: 100%;
		left: 0;
		right: 0;
		z-index: 10;
		margin: 0;
	}
	#container .header:not([hidden]) + #levels { top: 44px; }
	#levels label {
		font-weight: normal;
		font-size: 0.88em;
		padding: 0.9em 1em 0.9em 2.5em;
		border-left: 0; border-right: 0;
	}
	#levels label > input { top: 50%; transform: translateY(-50%); }
	#levels { box-shadow: 0 2px 6px rgba(0,0,0,.3); background: #fff; }

	#close {
		width: auto;
		margin: auto;
		margin-top: 1.5em;
		padding-top: 0.5em;
		padding-bottom: 0.5em;
		font-size: 0.88em;
		display: none;
	}
	</style>

	<script src="js/common.js"></script>
	<script src="js/gui/popup.js"></script>
</head>
<body>
	<div id="container">
		<header class="header no-menu">
			<h1 id="title"></h1>
		</header>
		<div id="levels" class="group" hidden>
			<label><input name="level" id="fixed" type="radio">Use fixed location</label>
			<label><input name="level" id="high" type="radio">High</label>
			<label><input name="level" id="medium" type="radio">Medium</label>
			<label><input name="level" id="low" type="radio">Low</label>
			<label><input name="level" id="real" type="radio">Use real location</label>
		</div>
		<ul class="menu-list">
			<li><a class="icon-carat-r" href="#" id="setLevel">Set level for <b></b></a></li>
			<li id="pauseItem"><a href="#" id="pause"></a></li>
			<li class="icon-pin"><a href="#" id="hideIcon">Hide icon</a></li>
			<li><a class="icon-gear" href="#" id="options">Options</a></li>
			<li><a class="icon-info" href="#" id="faq">What is Location Guard?</a></li>
		</ul>
		<button class="btn" id="close">Close</button>
	</div>
</body>
</html>
